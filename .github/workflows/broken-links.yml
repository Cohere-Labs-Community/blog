name: Check for broken links

# Builds the site from the PR and checks internal links and assets (offline, so
# results don't depend on external sites). Runs with a read-only token, so fork
# PRs get this check without approval. Production is re-checked after each
# deploy by broken-links-site.yml.

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - "_config.yml"
      - "_includes/**"
      - "_layouts/**"
      - "_pages/**"
      - "_plugins/**"
      - "_posts/**"
      - "_sass/**"
      - "assets/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/broken-links.yml"

permissions:
  contents: read

concurrency:
  group: broken-links-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build 🔧
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build --baseurl "" --future
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          args: --offline --remap '_site(/?.*)/assets/(.*) _site/assets/$2' --verbose --no-progress '_site/**/*.html'
