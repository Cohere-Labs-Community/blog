name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/prettier.yml"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/prettier.yml"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:
  # Production builds skip future-dated posts. Check hourly and redeploy once a post comes due.
  schedule:
    - cron: "17 * * * *"

# A newer run of the same PR replaces the older one. Production runs get their own group
# here; the deploy job's concurrency below runs them one at a time without cancelling.
concurrency:
  group: deploy-site-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-due:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Find posts due since the last deploy 📅
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Start time of the last successful non-PR run of this workflow (push, manual, or schedule).
          last=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.event != "pull_request")][0].run_started_at // empty')
          echo "Last successful production run started at: ${last:-never}"
          due=$(.github/scripts/posts-due.sh "$(date -d "${last:-1970-01-01T00:00:00Z}" +%s)")
          if [ -n "$due" ]; then
            printf 'Posts due since then:\n%s\n' "$due"
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "No posts came due; skipping deploy."
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-due
    if: >-
      !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      needs.check-due.outputs.due == 'true')
    concurrency:
      group: deploy-site-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install and Build 🔧
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          # Default clean would remove paths not present in _site; PR previews live under pr-preview/.
          clean-exclude: |
            pr-preview

  pr-build:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head 🛎️
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install and Build 🔧
        env:
          PR_BASEURL: /blog/pr-preview/pr-${{ github.event.pull_request.number }}
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build --baseurl "$PR_BASEURL" --future
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Upload site artifact 📦
        uses: actions/upload-artifact@v6
        with:
          name: pr-site-${{ github.event.pull_request.number }}
          path: _site
          retention-days: 3

  pr-deploy:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: pr-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # JamesIves/github-pages-deploy-action runs local `git config` and needs a git work tree.
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Download site artifact 📥
        uses: actions/download-artifact@v7
        with:
          name: pr-site-${{ github.event.pull_request.number }}
          path: _site
      - name: Deploy PR preview 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          target-folder: pr-preview/pr-${{ github.event.pull_request.number }}
          branch: gh-pages
      # github.repository_owner can be mixed-case for orgs; *.github.io hostnames must be lowercase.
      - name: Pages owner (lowercase) 🔡
        id: pages_owner
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: echo "lc=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Comment PR preview URL 💬
        uses: thollander/actions-comment-pull-request@v2
        with:
          comment_tag: pr-preview
          pr_number: ${{ github.event.pull_request.number }}
          message: |
            **PR preview** (updates on each push to this branch):

            https://${{ steps.pages_owner.outputs.lc }}.github.io/blog/pr-preview/pr-${{ github.event.pull_request.number }}/
